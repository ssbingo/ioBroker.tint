version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    ignore:
      # @types/node must stay at ^22 — our Node.js engine target is 22 LTS;
      # higher @types/node versions expose APIs that do not exist at runtime
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # React, MUI and Emotion majors follow ioBroker Admin's GUI API generation.
      # Admin 8 (GUI API generation 2) shares React 19, MUI 9 and Emotion 11 with the
      # settings panels as Module Federation singletons (see admin/vite.config.mjs);
      # the same majors are bundled as fallback copies and used by the admin tab, so
      # they must stay in sync with Admin. Bump them only together with a new Admin
      # GUI API generation.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/material"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@emotion/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@emotion/styled"
        update-types: ["version-update:semver-major"]
      # TypeScript major bumps require intentional evaluation with npm run check
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
